<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ .Title }} - {{ .Site.Title }}</title>
    {{ partial "head.html" . }}
    {{ $resumeCSS := resources.Get "css/resume.css" }}
    {{ if $resumeCSS }}
      <link rel="stylesheet" href="{{ $resumeCSS.RelPermalink }}" integrity="{{ $resumeCSS.Data.Integrity }}" crossorigin="anonymous">
    {{ else }}
      <link rel="stylesheet" href="/css/resume.css">
    {{ end }}
    <!-- ...existing head code... -->
  </head>
  <body>
    <!-- Navigation -->
    {{ partial "header.html" . }}
    <div class="container">
      <header class="page-header">
        <h1>{{ .Title }}</h1>
      </header>
      <main>
        <!-- Resume Summary from JSON -->
        {{ partial "resume/resume.html" . }}
        <!-- Removed duplicate static resume details -->
        <section id="resume-details">
          <!-- Resume details now generated dynamically from base_resume.json -->
        </section>
      </main>
    </div>
    <!-- ...existing footer code... -->
  </body>
</html>
