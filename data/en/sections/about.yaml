# a summary about you
summary: "Data Scientist driven by a passion to use data for positive change. My journey from homelessness to graduating top of my class at UC Berkeley fuels my commitment to impact-driven work. Worked as data scientist at a Bay Area startup. I optimized data pipelines, develop predictive models, and create in-house tools. Proficient in Python, SQL, AWS, NLP, machine learning, and data visualization.

At SetSail, I slashed data-processing times by 75% and scaled capacity by 400%, enabling real-time sales insights. Led projects that directly improved the data processing core. Also an advocate for inclusion and equity in tech. Mentored data science students at UC Berkeley, building an NGO chatbot, and recognized with the 2020-2021 Outstanding Undergraduate Award.

Seeking opportunities to leverage my data science expertise for social impact and drive results in collaborative environments."
