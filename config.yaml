    work:
      - name: "Caliber Public Schools"
        position: "Senior Data Scientist"
        startDate: "2024-10-20"
        summary: "Driving data strategy, modernizing infrastructure, and building ML capabilities as the sole data expert to enhance organizational effectiveness and data-driven decision-making."
        highlights:
          - "Owned the full data lifecycle (ingestion, processing, modeling, deployment, monitoring), leading DS, DE, & ML initiatives and guiding strategic data decisions as the sole data expert."
          - "Modernized the data infrastructure: designed and implemented automated, scalable pipelines and warehousing on GCP (BigQuery, GCS), leveraging APIs for diverse data source ingestion (HR systems, surveys) using a modern stack (Dagster, dbt, dlt)."
          - "Developed and deployed ML models (incl. Deep Learning, Bayesian methods - PyMC3) for predictive analytics (e.g., staff turnover) and insights (e.g., NLP for sentiment segmentation)."
          - "Designed and delivered training modules and resources via weekly sessions to upskill data practitioners across different teams, fostering data literacy and collaboration."
          - "Partnered with leadership and department heads to identify high-impact problems solvable with data science."
      - name: "SetSail"
        position: "Data Scientist"
        startDate: "2021-09-01"
        endDate: "2023-01-01"
        summary: "Applied data science and engineering skills within a B2B SaaS startup, developing ML features for sales intelligence platforms, optimizing data systems for scale, and working closely with customers to tailor solutions."
        highlights:
          - "Led the full lifecycle (proposal, design, implementation, testing, deployment) of a high-performance data pipeline overhaul on AWS (EC2, S3, Lambda, Athena), enabling near real-time ML applications and scaling data handling 4x (TBs scale)."
          - "Architected scalable data solutions using optimized data structures (star schema), efficient DAG management (manual orchestration), and async data ingestion techniques."
          - "Developed, deployed, and monitored production ML models, including recommendation algorithms (e.g., collaborative filtering approaches) optimizing sales action relevance using NLP (sentiment analysis), and predictive models (e.g., deal closure probability)."
          - "Worked directly with enterprise end-users and customer support teams to gather feedback, troubleshoot issues, and customize ML-driven features, ensuring practical value and adoption."
          - "Implemented software engineering best practices including comprehensive unit/integration testing and CI/CD pipelines (GitHub Actions) within an Agile (Shortcut) workflow."
          - "Collaborated closely with engineering, product, and customer support teams to define requirements, manage dependencies, and ensure successful project delivery in a dynamic startup environment."
      - name: "UC Berkeley School of Public Health"
        position: "Data Science Research Intern"
        startDate: "2020-09-01"
        endDate: "2021-05-01"
        summary: "Provided data science support for a faculty-led research team investigating social determinants of health and violence impacting homeless youth populations."
        highlights:
          - "Contributed programming skills (Python), including developing and evaluating Deep Learning models (LSTMs, Transformers) for intent classification in an NGO's mental health chatbot."
          - "Performed statistical analysis and geospatial analysis (ArcGIS) on sensitive survey and administrative data to identify patterns and risk factors related to youth homelessness."
          - "Collaborated with public health experts and community partners to develop robust, ethical research methodologies and ensure data privacy compliance."
          - "Contributed to data cleaning, preprocessing, and visualization for research reports and presentations."
